[tool:pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test collection and execution
addopts = 
    -ra
    --strict-markers
    --strict-config
    --verbose
    --tb=short

# Markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    frontend: marks tests as frontend tests
    backend: marks tests as backend tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# addopts = --cov=backend --cov=frontend --cov-report=html --cov-report=term

# Timeouts for tests (optional, if pytest-timeout is installed)
# timeout = 30

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning